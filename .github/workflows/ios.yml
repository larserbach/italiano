name: iOS build & tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          runtimes = sorted((k for k in devices if 'iOS' in k), reverse=True)
          print(next(d['udid'] for k in runtimes for d in devices[k] if d['name'].startswith('iPhone')))
          ")
          echo "SIMULATOR=$UDID" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          xcodebuild test \
            -project Italiano.xcodeproj \
            -scheme Italiano \
            -destination "id=$SIMULATOR" \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning:|Test Case|Executed|\*\* (BUILD|TEST)" || true
          test "${PIPESTATUS[0]}" -eq 0
